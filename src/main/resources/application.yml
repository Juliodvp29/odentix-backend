spring:
  application:
    name: odentix-backend
  datasource:
    # Valores por defecto SOLO para desarrollo local (docker-compose.yml).
    # En prod se sobreescriben con variables de entorno sin default (ver application-prod.yml).
    url: ${DB_URL:jdbc:postgresql://localhost:5434/odentix}
    username: ${DB_USERNAME:odentix}
    password: ${DB_PASSWORD:odentix}
    driver-class-name: org.postgresql.Driver
  jpa:
    # ddl-auto siempre en validate, en todos los perfiles, sin excepción.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # Todo por variables de entorno; sin defaults operativos (ver nota en odentix.notifications).
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          # Timeouts cortos: un proveedor caído no bloquea el flujo que originó
          # la notificación (principio de resiliencia, roadmap FASE8-05/10-03).
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

server:
  # Puerto 8081 en local porque el 8080 lo ocupa AgentService.exe.
  # No generalizar a otros entornos sin confirmarlo.
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # FASE12-03: health/info públicos (ver SecurityConfig); metrics y
        # prometheus requieren JWT (anyRequest().authenticated) — son conteos
        # JVM/HTTP, nunca datos de negocio.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  # FASE12-03: el registro Prometheus debe habilitarse explícito (sin esto la
  # auto-configuración considera el export deshabilitado y no crea el endpoint).
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    mail:
      # El email es opcional (adaptador de log por defecto, FASE8-03): la
      # ausencia de proveedor SMTP no debe marcar la app como DOWN.
      enabled: false

sentry:
  # Sin DSN el SDK queda inactivo (dev/test no envían nada). En prod Render
  # inyecta SENTRY_DSN. PII desactivado: nunca viajan datos de pacientes.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  send-default-pii: false
  # Sin tracing por ahora: solo errores (un OTel collector propio sería infra
  # nueva sin escala que la justifique).
  traces-sample-rate: 0.0

jwt:
  # Clave HMAC-SHA256 (al menos 256 bits = 32 caracteres). En prod se sobreescribe con JWT_SECRET.
  secret: ${JWT_SECRET:odentix_super_secret_jwt_key_for_development_purposes_only_123456}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
  refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

storage:
  s3:
    bucket: ${AWS_S3_BUCKET:odentix-files}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    path-style-access-enabled: ${AWS_S3_PATH_STYLE_ACCESS:false}

security:
  rate-limit:
    login:
      max-requests-per-minute: ${LOGIN_RATE_LIMIT_IP_MAX:10}
      max-failed-attempts: ${LOGIN_RATE_LIMIT_EMAIL_MAX_ATTEMPTS:5}
      lockout-duration-minutes: ${LOGIN_RATE_LIMIT_LOCKOUT_MINUTES:15}
    public:
      # FASE12-01: demás endpoints públicos sin JWT. Refresh es force-bruteable
      # (token opaco) → límite medio. Webhook recibe reintentos de Bold → generoso.
      refresh:
        max-requests-per-minute: ${REFRESH_RATE_LIMIT_IP_MAX:30}
      webhook:
        max-requests-per-minute: ${WEBHOOK_RATE_LIMIT_IP_MAX:120}

odentix:
  cors:
    # Orígenes de navegador permitidos (coma-separados). En prod se sobreescribe
    # con CORS_ALLOWED_ORIGINS sin default (ver application-prod.yml).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  crypto:
    # Llave AES-256 (32 bytes en base64) para secretos por tenant (tokens
    # WhatsApp). Generar con: openssl rand -base64 32. Nunca en el repo.
    key: ${DATA_ENCRYPTION_KEY:}
  jobs:
    overdue-installments:
      cron: ${OVERDUE_INSTALLMENTS_CRON:0 0 2 * * *}
    unconfirmed-appointments:
      cron: ${UNCONFIRMED_APPOINTMENTS_CRON:0 0 * * * *}
  opportunities:
    lead-unresponded-hours: ${OPPORTUNITIES_LEAD_UNRESPONDED_HOURS:24}
    inactive-patient-months: ${OPPORTUNITIES_INACTIVE_PATIENT_MONTHS:6}
  assistant:
    groq:
      # Clave del proveedor (GROQ_API_KEY, sin default): nunca hardcodeada.
      # Sin ella el endpoint responde 502 claro; el fallback a plantilla fija
      # llega en FASE10-03.
      api-key: ${GROQ_API_KEY:}
      # Modelo configurable porque rotan (default: ejemplo actual de sus docs).
      model: ${GROQ_MODEL:openai/gpt-oss-20b}
      base-url: ${GROQ_API_BASE_URL:https://api.groq.com/openai/v1}
  saas:
    bold:
      # Llave de identidad de Bold (panel.bold.co → Integraciones). Sin default:
      # sin ella el checkout responde error claro en vez de inventar cobros.
      api-key: ${BOLD_API_KEY:}
      base-url: ${BOLD_API_BASE_URL:https://integrations.api.bold.co}
      # Secreto para verificar x-bold-signature (vacío en sandbox, como indica
      # su documentación para ambiente de pruebas).
      webhook-secret: ${BOLD_WEBHOOK_SECRET:}
  notifications:
    email:
      # Adaptador SMTP real (SmtpEmailNotificationSender). Apagado por defecto:
      # sin proveedor elegido no hay credenciales que configurar ,
      # y los flujos usan el adaptador de registro en log.
      enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
      from: ${NOTIFICATIONS_EMAIL_FROM:}
    whatsapp:
      # Adaptador WhatsApp Cloud API (WhatsappNotificationSender, FASE8-05).
      # Apagado por defecto: requiere número aprobado por Meta + token real,
      # proceso administrativo fuera del código. Sin configurar, los intentos
      # por este canal quedan como fallida auditable, nunca bloquean nada.
      enabled: ${NOTIFICATIONS_WHATSAPP_ENABLED:false}
      api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v21.0}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      token: ${WHATSAPP_TOKEN:}




