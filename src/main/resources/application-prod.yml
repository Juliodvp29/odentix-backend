spring:
  datasource:
    # En prod NO hay defaults: la plataforma (Render/Railway) inyecta estas variables.
    # Si falta alguna, la app debe fallar al arrancar antes que conectarse a una BD equivocada.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    # Arranque diferido SOLO en prod (diagnosticado 2026-09-19): con 34
    # repositorios, parsear/validar todas las queries JPQL al inicio tarda
    # ~13 min en la CPU estrangulada del plan free y Render declara timeout
    # sin puerto. En lazy el /health responde en segundos; las queries igual
    # quedan verificadas porque la suite las ejercita todas (clean verify).
    # Dev/test siguen eager (fail-fast).
  data:
    jpa:
      repositories:
        bootstrap-mode: lazy

server:
  # En prod el proveedor asigna el puerto vía $PORT.
  port: ${PORT:8080}

# La documentación interactiva no se expone en producción.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# FASE12-03: Sentry activo en prod vía SENTRY_DSN (inyectado por Render).
# Sin DSN no se envía nada; el entorno por defecto distingue los eventos.
sentry:
  environment: ${SENTRY_ENVIRONMENT:production}
